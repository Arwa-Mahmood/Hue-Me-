<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7DCE6">
<title>Hue&Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3A1F1A;          /* brand + body text */
    --accent: #B8714F;       /* "Log in" subtitle */
    --field: #FDEEF2;        /* input fill */
    --field-line: #EBCFD7;
    --placeholder: #8F7175;
    --pink: #F1A6BF;         /* main button */
    --pink-hover: #EB93B0;
    --error: #B43B52;
    --ok: #3D7A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #F6E3EA url("/auth/bg.jpg") center / cover no-repeat fixed;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  /* Phones: smaller image, and no "fixed" (iOS ignores it and it can stutter) */
  @media (max-width: 700px) {
    body { background-image: url("/auth/bg-small.jpg"); background-attachment: scroll; }
  }

  main {
    width: 100%;
    max-width: 424px;
    padding: 46px 34px 38px;
    border-radius: 26px;
    /* Frosted glass, same recipe as the ME and admin pages. The blur sits on ::before, behind the
       content, so the text is not drawn inside the blurred layer and stays crisp. A bit whiter
       here so the makeup in the background doesn't show through the form. */
    position: relative; isolation: isolate;
    background: rgba(255, 255, 255, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 12px 32px rgba(120, 80, 110, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }
  main::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    backdrop-filter: blur(14px) saturate(160%);
  }
  @media (max-width: 420px) {
    main { padding: 38px 22px 30px; border-radius: 22px; }
  }

  h1 {
    margin: 0;
    text-align: center;
    font-family: "Young Serif", Georgia, serif;
    font-weight: 400;          /* Young Serif only comes in one (already heavy) weight */
    font-size: 42px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  h2 {
    margin: 10px 0 30px;
    text-align: center;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
  }

  section { display: none; }
  section.active { display: block; }
  form { display: flex; flex-direction: column; gap: 14px; margin: 0; }

  input {
    width: 100%;
    height: 50px;
    padding: 0 16px;
    font: inherit;
    font-size: 16px;           /* 16px stops phones zooming in on focus */
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--field-line);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input::placeholder { color: var(--placeholder); }
  input:focus {
    background: #FFF6F9;
    border-color: #E39AB3;
    box-shadow: 0 0 0 3px rgba(241, 166, 191, 0.28);
  }

  /* Password field with the show/hide eye */
  .pw { position: relative; }
  .pw input { padding-right: 52px; }
  .eye {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .eye:hover { background: rgba(58, 31, 26, 0.06); }
  .eye svg { width: 22px; height: 22px; }
  .eye .show { display: none; }
  .eye[aria-pressed="true"] .show { display: block; }
  .eye[aria-pressed="true"] .hide { display: none; }

  .primary {
    width: 100%;
    height: 50px;
    margin-top: 2px;
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink);
    background: var(--pink);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(235, 147, 176, 0.28);
    transition: background .15s, transform .05s;
  }
  .primary:hover { background: var(--pink-hover); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { opacity: .6; cursor: wait; }

  .links {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
  }
  .links.center { justify-content: center; }
  .link {
    min-height: 44px;           /* comfortable tap target on phones */
    padding: 0 2px;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: none;
  }
  .link:hover { text-decoration: underline; text-underline-offset: 3px; }

  button:focus-visible, .link:focus-visible {
    outline: 2px solid #C96A8A;
    outline-offset: 2px;
  }

  .hint { margin: -14px 0 22px; text-align: center; font-size: 14px; color: var(--placeholder); }

  #msg { margin-top: 16px; min-height: 20px; text-align: center; font-size: 14px; }
  #msg:empty { margin-top: 0; min-height: 0; }
  .err { color: var(--error); } .ok { color: var(--ok); }
  #role { text-align: center; color: var(--placeholder); margin: -18px 0 22px; }
</style>
</head>
<body>
<main>
  <h1>Hue&amp;Me</h1>

  <section id="login" class="active">
    <h2>Log in</h2>
    <form onsubmit="event.preventDefault(); login()">
      <input id="l-email" type="email" placeholder="Email" autocomplete="email" inputmode="email" required>
      <div class="pw">
        <input id="l-pass" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="eye" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button type="submit" class="primary">Log in</button>
    </form>
    <div class="links">
      <button type="button" class="link" onclick="show('signup')">Create an account</button>
      <button type="button" class="link" onclick="show('forgot')">Forgot password?</button>
    </div>
  </section>

  <section id="signup">
    <h2>Sign up</h2>
    <form onsubmit="event.preventDefault(); signup()">
      <input id="s-email" type="email" placeholder="Email" autocomplete="email" inputmode="email" required>
      <div class="pw">
        <input id="s-pass" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" minlength="8" required>
        <button type="button" class="eye" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button type="submit" class="primary">Send verification code</button>
    </form>
    <div class="links center">
      <button type="button" class="link" onclick="show('login')">Back to log in</button>
    </div>
  </section>

  <section id="verify">
    <h2>Enter the code we emailed you</h2>
    <form onsubmit="event.preventDefault(); verifySignup()">
      <input id="v-otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required>
      <button type="submit" class="primary">Verify and create account</button>
    </form>
    <div class="links center">
      <button type="button" class="link" onclick="show('signup')">Back</button>
    </div>
  </section>

  <section id="forgot">
    <h2>Forgot password</h2>
    <form onsubmit="event.preventDefault(); forgot()">
      <input id="f-email" type="email" placeholder="Email" autocomplete="email" inputmode="email" required>
      <button type="submit" class="primary">Send reset code</button>
    </form>
    <div class="links center">
      <button type="button" class="link" onclick="show('login')">Back to log in</button>
    </div>
  </section>

  <section id="reset">
    <h2>Reset password</h2>
    <form onsubmit="event.preventDefault(); resetPassword()">
      <input id="r-otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required>
      <div class="pw">
        <input id="r-pass" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" minlength="8" required>
        <button type="button" class="eye" aria-label="Show password" aria-pressed="false"></button>
      </div>
      <button type="submit" class="primary">Update password</button>
    </form>
    <div class="links center">
      <button type="button" class="link" onclick="show('login')">Back to log in</button>
    </div>
  </section>

  <section id="home">
    <h2 id="welcome"></h2>
    <p id="role"></p>
    <button type="button" class="primary" onclick="logout()">Log out</button>
  </section>

  <div id="msg" role="status" aria-live="polite"></div>
</main>

<script src="/hueme-config.js"></script>
<script>
// Show/hide password eye (icon only; the field keeps working without it)
const EYE_OFF = '<svg class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const EYE_ON = '<svg class="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
document.querySelectorAll(".eye").forEach(btn => {
  btn.innerHTML = EYE_OFF + EYE_ON;
  btn.addEventListener("click", () => {
    const input = btn.previousElementSibling;
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    btn.setAttribute("aria-pressed", String(!showing));
    btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });
});
</script>
<script>
// Backend address comes from the app's NEXT_PUBLIC_API_URL (see app/hueme-config.js)
const API = window.HUEME_API_URL || "http://localhost:8000";
let pendingEmail = "";

const $ = id => document.getElementById(id);
function show(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  say("");
}
function say(text, ok = false) {
  $("msg").textContent = text;
  $("msg").className = ok ? "ok" : "err";
}

async function call(path, body, token) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  try {
    const r = await fetch(API + path, {
      method: body ? "POST" : "GET", headers,
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = data.detail;
      throw new Error(Array.isArray(d) ? d.map(e => e.msg).join(", ") : d || "Request failed");
    }
    return data;
  } catch (e) { say(e.message); return null; }
}

async function signup() {
  pendingEmail = $("s-email").value.trim();
  const d = await call("/auth/signup", { email: pendingEmail, password: $("s-pass").value });
  if (d) { show("verify"); say("Code sent. Check your inbox and Spam.", true); }
}
async function verifySignup() {
  const d = await call("/auth/verify-signup", { email: pendingEmail, otp: $("v-otp").value.trim() });
  if (d) enter(d.access_token);
}
async function login() {
  const d = await call("/auth/login", { email: $("l-email").value.trim(), password: $("l-pass").value });
  if (d) enter(d.access_token);
}
async function forgot() {
  pendingEmail = $("f-email").value.trim();
  const d = await call("/auth/forgot-password", { email: pendingEmail });
  if (d) { show("reset"); say("If that email exists, a code was sent.", true); }
}
// Named resetPassword, not reset: inside a <form> handler, "reset()" means the form's own
// built-in reset (which only clears the fields), so the old name never reached the backend.
async function resetPassword() {
  const d = await call("/auth/reset-password",
    { email: pendingEmail, otp: $("r-otp").value.trim(), new_password: $("r-pass").value });
  if (d) { show("login"); say("Password updated. Log in.", true); }
}
async function enter(token) {
  localStorage.setItem("token", token);
  const me = await call("/auth/me", null, token);
  if (!me) return logout();
  show("home");
  $("welcome").textContent = "Welcome, " + me.email;
  $("role").textContent = "Role: " + me.role;
  // Integration: hand over to the Next.js app (admins -> admin form, users -> ME page)
  location.replace(me.role === "admin" ? "/admin" : "/me");
}
function logout() { localStorage.removeItem("token"); show("login"); }

const saved = localStorage.getItem("token");
if (saved) enter(saved);   // session persists across refresh (US2)
</script>
</body>
</html>
